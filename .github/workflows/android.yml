name: Build Android app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Bundle the web page into the app
        run: |
          mkdir -p android/app/src/main/assets/icons
          cp index.html silent.webm silent.mp4 android/app/src/main/assets/
          cp icons/*.png android/app/src/main/assets/icons/
      - name: Build signed APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/deskclock.p12"
          export KEYSTORE_PATH="$RUNNER_TEMP/deskclock.p12"
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk DeskClock.apk
      - name: Publish to the "apk" release (fixed download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk >/dev/null 2>&1 || gh release create apk --target "$GITHUB_SHA" --title "Desk Clock app" --notes "Download DeskClock.apk on the phone and open it to install or update."
          gh release upload apk DeskClock.apk --clobber
          gh release edit apk --notes "Build ${{ github.run_number }} from ${GITHUB_SHA::7}. Download DeskClock.apk on the phone and open it to install or update."
