plugins { id "com.android.application" }

android {
    namespace "io.github.barjeshjaincoder.deskclock"
    compileSdk 34
    defaultConfig {
        applicationId "io.github.barjeshjaincoder.deskclock"
        minSdk 24
        targetSdk 34
        versionCode((System.getenv("VERSION_CODE") ?: "1") as Integer)
        versionName "1." + (System.getenv("VERSION_CODE") ?: "0")
    }
    // The signing key lives outside the repo (GitHub secret in CI), so every build can update the installed app.
    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "missing.p12")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias "deskclock"
            keyPassword System.getenv("KEYSTORE_PASSWORD")
            storeType "pkcs12"
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation "androidx.webkit:webkit:1.11.0" }
