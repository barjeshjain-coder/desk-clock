<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Desk Clock</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500&display=swap">
<style>
  /* Layout: one black screen. Huge time on top, date under it, a hairline, then weather left / air quality right. */
  :root {
    --bg: #000;
    --fg: #fff;
    --dim: #8c8c8c;
    --faint: #3a3a3a;
    --line: #262626;
    --font: "Inter Tight", "Helvetica Neue", Arial, system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: var(--font);
    font-variant-numeric: tabular-nums;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    cursor: default;
  }
  #stage {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    padding: 2vh 2.5vw 6.5vh 2.5vw;
    display: flex; flex-direction: row; align-items: center;
    transition: opacity 2s ease, transform 3s ease;
  }
  body.night #stage { opacity: .42; }

  /* Sizes below are starting points; fit() in the script scales them to fill the actual screen. */
  .clock { flex: 2.9 1 0; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
  .time { display: inline-flex; align-items: flex-start; line-height: .86; font-weight: 300; letter-spacing: -.05em; font-size: 120px; white-space: nowrap; }
  .time .colon { animation: blink 2s steps(1) infinite; padding: 0; }
  @keyframes blink { 50% { opacity: .25; } }
  .time .side { display: flex; flex-direction: column; justify-content: space-between; margin-left: .06em; padding-top: .04em; height: .74em; }
  .time .sec, .time .ampm { font-size: .14em; font-weight: 300; letter-spacing: .02em; color: var(--dim); line-height: 1; }
  .date { display: inline-block; margin-top: .3em; font-size: 24px; font-weight: 300; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; padding-left: .12em; }
  .date .wd { font-weight: 500; }

  hr { border: 0; border-left: 1px solid var(--line); align-self: stretch; margin: 3vh 2vw; }

  .info { flex: 1 1 0; min-width: 0; font-size: 20px; }
  .info-in { display: inline-block; }
  .block + .block { margin-top: .9em; }
  .label { font-size: .5em; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
  .big { font-size: 2.9em; font-weight: 200; line-height: 1; letter-spacing: -.03em; margin: .06em 0 .02em; white-space: nowrap; }
  .big .unit { font-size: .45em; vertical-align: .75em; letter-spacing: 0; color: var(--dim); margin-left: .04em; }
  .cond { font-size: .95em; white-space: nowrap; }
  .meta { font-size: .62em; color: var(--dim); font-weight: 300; margin-top: .3em; white-space: nowrap; }
  .meta b { color: var(--fg); font-weight: 400; }

  /* AQI scale: six cells, filled up to the current band (no colour, just fill) */
  .scale { display: flex; margin-top: .55em; }
  .scale i { display: block; width: 1.5em; height: .3em; margin-right: .22em; border: 1px solid var(--dim); border-radius: 1px; }
  .scale i.on { background: var(--fg); border-color: var(--fg); }

  .foot {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 0 2.5vw 1.2vh 2.5vw;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 2.6vh; color: var(--faint); letter-spacing: .08em;
  }
  .foot button { all: unset; cursor: pointer; padding: 1vh 1vw; color: var(--faint); letter-spacing: .14em; text-transform: uppercase; }
  .foot button:focus-visible { outline: 1px solid var(--dim); }
  .awake { color: var(--dim); letter-spacing: .14em; text-transform: uppercase; }
  .awake[hidden] { display: none; }

  /* Portrait: clock on top, weather and air quality below */
  @media (orientation: portrait) {
    #stage { flex-direction: column; align-items: stretch; justify-content: center; padding: 5vh 6vw 9vh 6vw; }
    .clock { flex: none; align-items: center; }
    hr { border-left: 0; border-top: 1px solid var(--line); margin: 3vh 0; }
    .info { flex: none; }
    .foot { font-size: 1.4vh; padding: 0 6vw 1.6vh 6vw; }
  }

  /* Settings */
  #settings {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.94); display: flex; align-items: center; justify-content: center;
    padding: 4vh 5vw; z-index: 5;
  }
  #settings[hidden] { display: none; }
  .panel { width: 560px; max-width: 100%; max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 18px; font-size: 16px; user-select: text; -webkit-user-select: text; }
  .panel h2 { margin: 0; font-weight: 300; letter-spacing: .2em; text-transform: uppercase; font-size: 15px; color: var(--dim); }
  .panel input[type=text] {
    width: 100%; background: #000; color: #fff; border: 1px solid #555; border-radius: 4px; padding: 12px 14px; font: inherit; font-size: 18px;
  }
  .panel input[type=text]:focus { outline: none; border-color: #fff; }
  .results { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .results button, .opt button, .actions button {
    all: unset; cursor: pointer; padding: 12px 4px; border-bottom: 1px solid var(--line); color: #fff;
  }
  .results button small { color: var(--dim); margin-left: 8px; }
  .results button:hover, .results button:focus-visible { background: #111; }
  .opt { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .opt span { color: var(--dim); }
  .seg { display: flex; border: 1px solid #555; border-radius: 4px; overflow: hidden; }
  .seg button { all: unset; cursor: pointer; padding: 8px 14px; color: var(--dim); }
  .seg button[aria-pressed=true] { background: #fff; color: #000; }
  .seg button:focus-visible { outline: 1px solid #fff; outline-offset: -3px; }
  .actions { display: flex; justify-content: space-between; gap: 12px; }
  .actions button { border: 1px solid #555; border-radius: 4px; padding: 10px 18px; }
  .actions button.primary { background: #fff; color: #000; border-color: #fff; }
  .hint { color: var(--dim); font-size: 14px; line-height: 1.5; margin: 0; }

  /* ---------- Themes ---------- */
  /* Colour: blue accents, temperature tinted by how warm it is, AQI in the standard US EPA band colours. */
  body.t-color { --accent: #5ab8ff; --line: #1d2a3a; --dim: #8fa3b8; --faint: #3c4a5a; }
  body.t-color .colon { color: var(--accent); }
  body.t-color .date .wd, body.t-color .label { color: var(--accent); }
  body.t-color #temp { color: var(--c-temp, #fff); }
  body.t-color #aqi, body.t-color #aqiText { color: var(--c-aqi, #fff); }
  body.t-color .scale i { border-color: #333; }
  body.t-color .scale i.on { border-color: transparent; }
  body.t-color .scale i:nth-child(1).on { background: #00e400; }
  body.t-color .scale i:nth-child(2).on { background: #ffff00; }
  body.t-color .scale i:nth-child(3).on { background: #ff7e00; }
  body.t-color .scale i:nth-child(4).on { background: #ff0000; }
  body.t-color .scale i:nth-child(5).on { background: #8f3f97; }
  body.t-color .scale i:nth-child(6).on { background: #7e0023; }
  /* Amber: warm, low-blue light for the bedside at night. */
  body.t-amber { --fg: #ffb547; --dim: #a8742a; --faint: #5a3d14; --line: #2e1f0a; }
  body.t-amber, body.t-amber .time, body.t-amber .scale i.on { color: var(--fg); }
  body.t-amber .scale i.on { background: var(--fg); border-color: var(--fg); }
  body.t-amber .scale i { border-color: var(--dim); }

  @media (prefers-reduced-motion: reduce) { .time .colon { animation: none; } #stage { transition: none; } }
</style>
</head>
<body>
<div id="stage">
  <div class="clock">
    <div class="time" aria-live="off">
      <span id="hh">--</span><span class="colon">:</span><span id="mm">--</span>
      <span class="side"><span class="ampm" id="ampm"></span><span class="sec" id="ss"></span></span>
    </div>
    <div class="date" id="date"></div>
  </div>
  <hr>
  <div class="info"><div class="info-in">
    <div class="block">
      <div class="label">Weather</div>
      <div class="big"><span id="temp">--</span><span class="unit" id="tunit">°</span></div>
      <div class="row"><span class="cond" id="cond">Loading</span></div>
      <div class="meta" id="wmeta">&nbsp;</div>
      <div class="meta" id="wmeta2">&nbsp;</div>
    </div>
    <div class="block">
      <div class="label">Air · US AQI</div>
      <div class="big" id="aqi">--</div>
      <div class="row"><span class="cond" id="aqiText">Loading</span></div>
      <div class="meta" id="ameta">&nbsp;</div>
      <div class="scale" id="scale"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
  </div></div>
</div>

<div class="foot">
  <span id="status"></span>
  <span id="awake" class="awake">Tap anywhere to keep the screen on</span>
  <button id="openSettings" type="button" aria-label="Open settings">Settings</button>
</div>

<div id="settings" hidden>
  <div class="panel" role="dialog" aria-labelledby="setTitle">
    <h2 id="setTitle">Location</h2>
    <input type="text" id="cityInput" placeholder="Type your city, e.g. Bengaluru" autocomplete="off">
    <div class="results" id="results"></div>
    <h2>Display</h2>
    <div class="opt"><span>Theme</span><div class="seg" data-key="theme"><button type="button" data-v="mono">Mono</button><button type="button" data-v="color">Colour</button><button type="button" data-v="amber">Amber</button></div></div>
    <div class="opt"><span>Clock</span><div class="seg" data-key="h24"><button type="button" data-v="false">12 h</button><button type="button" data-v="true">24 h</button></div></div>
    <div class="opt"><span>Seconds</span><div class="seg" data-key="secs"><button type="button" data-v="true">Show</button><button type="button" data-v="false">Hide</button></div></div>
    <div class="opt"><span>Temperature</span><div class="seg" data-key="fahr"><button type="button" data-v="false">°C</button><button type="button" data-v="true">°F</button></div></div>
    <div class="opt"><span>Dim 10 pm – 6 am</span><div class="seg" data-key="night"><button type="button" data-v="true">On</button><button type="button" data-v="false">Off</button></div></div>
    <p class="hint" id="tapHint">Tap anywhere on the clock to go full screen and keep the screen awake.</p>
    <h2>Freeze log</h2>
    <p class="hint" id="stallLog">None recorded.</p>
    <div class="actions">
      <button type="button" id="useGps">Use my location</button>
      <button type="button" class="primary" id="closeSettings">Done</button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const STORE = "deskclock.v1";
  const defaults = { h24: false, secs: true, fahr: false, night: true, theme: "mono", loc: null };
  // Running inside the Android app: it keeps the screen on itself, so no wake lock, video or full-screen tap.
  const NATIVE = /DeskClockApp/.test(navigator.userAgent);
  function applyTheme() { document.body.className = document.body.className.replace(/\bt-\w+/g, "").trim(); document.body.classList.add("t-" + (cfg.theme || "mono")); }
  let cfg = Object.assign({}, defaults);
  try { Object.assign(cfg, JSON.parse(localStorage.getItem(STORE) || "{}")); } catch (e) {}
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(cfg)); } catch (e) {} };

  /* ---------- Clock ---------- */
  const pad = n => ("0" + n).slice(-2);
  const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  let lastMin = -1, lastTick = Date.now();
  // Stall log: if the page was frozen (e.g. the phone throttled Chrome overnight),
  // note when and for how long, then recover: refit, refresh data, re-take the wake lock.
  const LOG = "deskclock.stalls";
  function logStall(kind, secs) {
    try {
      const list = JSON.parse(localStorage.getItem(LOG) || "[]");
      list.unshift(new Date().toLocaleString() + "  " + kind + (secs ? " " + secs + "s" : ""));
      localStorage.setItem(LOG, JSON.stringify(list.slice(0, 15)));
    } catch (e) {}
  }
  function recover() { lastMin = -1; if (typeof refreshAll === "function") refreshAll(); if (typeof keepAwake === "function") keepAwake(); }
  function tick() {
    const d = new Date();
    const gap = d.getTime() - lastTick; lastTick = d.getTime();
    if (gap > 15000) { logStall("stalled", Math.round(gap / 1000)); recover(); }
    let h = d.getHours();
    $("ampm").textContent = cfg.h24 ? "" : (h < 12 ? "AM" : "PM");
    if (!cfg.h24) h = h % 12 || 12;
    $("hh").textContent = cfg.h24 ? pad(h) : String(h);
    $("mm").textContent = pad(d.getMinutes());
    $("ss").textContent = cfg.secs ? pad(d.getSeconds()) : "";
    if (d.getMinutes() !== lastMin) {
      lastMin = d.getMinutes();
      $("date").innerHTML = "";
      const wd = document.createElement("span"); wd.className = "wd"; wd.textContent = DAYS[d.getDay()];
      $("date").append(wd, document.createTextNode(" · " + d.getDate() + " " + MONTHS[d.getMonth()].slice(0, 3)));
      const hr = d.getHours();
      document.body.classList.toggle("night", cfg.night && (hr >= 22 || hr < 6));
      // Nudge the layout a few pixels each minute so an OLED screen doesn't burn in.
      const dx = Math.round(Math.random() * 12 - 6), dy = Math.round(Math.random() * 12 - 6);
      $("stage").style.transform = `translate(${dx}px, ${dy}px)`;
      if (typeof fit === "function") fit();
    }
  }
  // Two independent timers drive the clock, so one being throttled doesn't stop it.
  setInterval(tick, 250);
  (function rafLoop() { requestAnimationFrame(() => { if (Date.now() - lastTick > 900) tick(); rafLoop(); }); })();
  ["freeze", "resume", "pageshow", "focus"].forEach(ev =>
    (ev === "freeze" || ev === "resume" ? document : window).addEventListener(ev, () => { if (ev !== "focus") logStall(ev); tick(); if (ev !== "freeze") recover(); }));

  /* ---------- Weather ---------- */
  const WMO = {
    0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Freezing fog",
    51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",56:"Freezing drizzle",57:"Freezing drizzle",
    61:"Light rain",63:"Rain",65:"Heavy rain",66:"Freezing rain",67:"Freezing rain",
    71:"Light snow",73:"Snow",75:"Heavy snow",77:"Snow grains",
    80:"Light showers",81:"Showers",82:"Heavy showers",85:"Snow showers",86:"Snow showers",
    95:"Thunderstorm",96:"Thunderstorm, hail",99:"Thunderstorm, hail"
  };
  const AQI_BANDS = [
    [50,"Good"],[100,"Moderate"],[150,"Unhealthy for some"],[200,"Unhealthy"],[300,"Very unhealthy"],[Infinity,"Hazardous"]
  ];
  const r = n => Math.round(n);
  const timeStr = iso => { const t = new Date(iso); let h = t.getHours(); const m = pad(t.getMinutes()); if (cfg.h24) return pad(h)+":"+m; return (h%12||12)+":"+m+(h<12?" am":" pm"); };

  async function getJSON(url) {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  async function loadWeather() {
    if (!cfg.loc) return;
    const { lat, lon } = cfg.loc;
    const u = cfg.fahr ? "&temperature_unit=fahrenheit" : "";
    try {
      const w = await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1${u}`);
      const c = w.current;
      $("temp").textContent = r(c.temperature_2m);
      const tc = cfg.fahr ? (c.temperature_2m - 32) / 1.8 : c.temperature_2m;
      document.body.style.setProperty("--c-temp", tc < 5 ? "#8ec9ff" : tc < 15 ? "#5ab8ff" : tc < 25 ? "#7be0a8" : tc < 32 ? "#ffc247" : tc < 38 ? "#ff8a3d" : "#ff4d4d");
      $("tunit").textContent = cfg.fahr ? "°F" : "°C";
      $("cond").textContent = WMO[c.weather_code] || "—";
      pairs($("wmeta"), [["High", r(w.daily.temperature_2m_max[0]) + "°"], ["Low", r(w.daily.temperature_2m_min[0]) + "°"]]);
      pairs($("wmeta2"), [["Feels", r(c.apparent_temperature) + "°"], ["RH", c.relative_humidity_2m + "%"]]);
      stamp(); fit();
    } catch (e) { $("status").textContent = "Weather unavailable. Retrying soon."; }
  }

  async function loadAir() {
    if (!cfg.loc) return;
    const { lat, lon } = cfg.loc;
    try {
      const a = await getJSON(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=us_aqi,pm2_5,pm10&timezone=auto`);
      const c = a.current, v = r(c.us_aqi);
      $("aqi").textContent = isFinite(v) ? v : "--";
      const band = AQI_BANDS.findIndex(([max]) => v <= max);
      $("aqiText").textContent = band >= 0 ? AQI_BANDS[band][1] : "—";
      // EPA colours; yellow/maroon lifted slightly so they read on black.
      document.body.style.setProperty("--c-aqi", ["#00e400","#ffff00","#ff7e00","#ff3b3b","#b45cc0","#c0284a"][band] || "#fff");
      Array.prototype.forEach.call($("scale").children, (el, i) => el.classList.toggle("on", i <= band));
      pairs($("ameta"), [["PM2.5", r(c.pm2_5)], ["PM10", r(c.pm10)]]);
      stamp(); fit();
    } catch (e) { $("status").textContent = "Air quality unavailable. Retrying soon."; }
  }

  function pairs(el, list) {
    el.innerHTML = "";
    list.forEach((kv, i) => {
      if (i) el.appendChild(document.createTextNode("  ·  "));
      el.appendChild(document.createTextNode(kv[0] + " "));
      const b = document.createElement("b"); b.textContent = kv[1]; el.appendChild(b);
    });
  }

  /* ---------- Fill the screen ---------- */
  // Measures the content at a known size, then scales it so the clock fills its side
  // and weather/AQI fill theirs, whatever the phone's screen shape.
  function fit() {
    const stage = $("stage"), cs = getComputedStyle(stage);
    const W = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const H = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    if (W <= 0 || H <= 0) return;
    const portrait = window.innerHeight > window.innerWidth;
    const clock = document.querySelector(".clock"), info = document.querySelector(".info"), inner = document.querySelector(".info-in");
    const time = document.querySelector(".time"), date = $("date"), hr = document.querySelector("hr");

    // Clock: measure the time as shown now (refitted every minute, so 9:59 -> 10:00 still fits).
    time.style.fontSize = "100px"; date.style.fontSize = "100px";
    const tw = time.getBoundingClientRect().width, th = time.getBoundingClientRect().height;
    const dw = date.getBoundingClientRect().width, dh = date.getBoundingClientRect().height + 40;

    const cW = (portrait ? W : clock.getBoundingClientRect().width) * 0.99;
    const cHmax = portrait ? H * 0.46 : H;
    let tf = Math.min(cW / tw, cHmax * 0.8 / th) * 100;
    let df = Math.min(cW / dw * 100, tf * 0.15);
    const used = (th * tf + dh * df) / 100;
    if (used > cHmax) { const k = cHmax / used; tf *= k; df *= k; }
    time.style.fontSize = tf.toFixed(1) + "px"; date.style.fontSize = df.toFixed(1) + "px";

    // Weather + AQI panel
    info.style.fontSize = "20px";
    const iw = inner.getBoundingClientRect().width, ih = inner.getBoundingClientRect().height;
    let iW, iH;
    if (portrait) {
      const hm = getComputedStyle(hr);
      iW = W; iH = H - clock.getBoundingClientRect().height - hr.offsetHeight - parseFloat(hm.marginTop) - parseFloat(hm.marginBottom);
    } else { iW = info.getBoundingClientRect().width; iH = H; }
    const f = 20 * Math.min(iW * 0.97 / iw, iH * 0.97 / ih);
    if (f > 0) info.style.fontSize = f.toFixed(1) + "px";
  }
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", () => setTimeout(fit, 300));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  function stamp() {
    $("status").textContent = (cfg.loc ? cfg.loc.name : "") + "  ·  updated " + timeStr(new Date().toISOString());
  }
  function refreshAll() { loadWeather(); loadAir(); }
  setInterval(loadWeather, 10 * 60 * 1000);
  setInterval(loadAir, 20 * 60 * 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { refreshAll(); keepAwake(); } });
  window.addEventListener("online", refreshAll);

  /* ---------- Full screen + keep the screen on ---------- */
  // 1) Screen Wake Lock: asked for as soon as the app opens, and again whenever it is lost.
  // 2) A silent looping video (below) that also stops Chrome freezing the page.
  let lock = null, videoOn = false;
  async function keepAwake() {
    if (NATIVE) return;
    if ("wakeLock" in navigator) {
      if (lock || document.hidden) return;
      try {
        lock = await navigator.wakeLock.request("screen");
        lock.addEventListener("release", () => { lock = null; showAwake(); if (!document.hidden) setTimeout(keepAwake, 1000); });
      } catch (e) { lock = null; }
    }
    showAwake();
  }
  // Silent looping video, always on: Chrome does not freeze a page that is playing media,
  // and on phones without Wake Lock it also keeps the screen awake. Muted, so it may start without a tap.
  let vid = null;
  function startVideoFallback() {
    if (!vid) {
      vid = document.createElement("video");
      vid.muted = true; vid.loop = true; vid.playsInline = true;
      vid.setAttribute("muted", ""); vid.setAttribute("playsinline", ""); vid.setAttribute("aria-hidden", "true");
      vid.style.cssText = "position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none;";
      [["silent.webm", "video/webm"], ["silent.mp4", "video/mp4"]].forEach(([src, type]) => {
        const so = document.createElement("source"); so.src = src; so.type = type; vid.appendChild(so);
      });
      vid.addEventListener("playing", () => { videoOn = true; showAwake(); });
      vid.addEventListener("pause", () => { videoOn = false; showAwake(); });
      document.body.appendChild(vid);
    }
    try { const p = vid.play(); if (p && p.catch) p.catch(() => { videoOn = false; showAwake(); }); } catch (e) {}
  }
  function isAwake() { return !!lock || videoOn; }
  function showAwake() {
    const hint = $("awake");
    if (hint) hint.hidden = isAwake();
  }
  function onTap() {
    if (NATIVE) return;
    keepAwake().then(startVideoFallback);
    const el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) { const r = el.requestFullscreen({ navigationUI: "hide" }); if (r && r.catch) r.catch(() => {}); }
  }
  $("stage").addEventListener("click", onTap);
  if (NATIVE) { $("awake").hidden = true; } else {
    document.addEventListener("touchend", () => { if (!isAwake() || !videoOn) onTap(); }, { passive: true });
    setInterval(() => { if (!lock) keepAwake(); if (!videoOn) startVideoFallback(); }, 30000);
    keepAwake(); startVideoFallback(); // muted video may autostart without a tap
  }

  /* ---------- Settings ---------- */
  function syncSeg() {
    document.querySelectorAll(".seg").forEach(seg => {
      const k = seg.dataset.key;
      seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(String(cfg[k]) === b.dataset.v)));
    });
  }
  document.querySelectorAll(".seg").forEach(seg => seg.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const k = seg.dataset.key, before = cfg[k];
    const v = b.dataset.v; cfg[k] = v === "true" ? true : v === "false" ? false : v; save(); syncSeg(); applyTheme(); lastMin = -1; tick(); fit();
    if (k === "fahr" && before !== cfg[k]) loadWeather();
  }));

  function openSettings() {
    let list = []; try { list = JSON.parse(localStorage.getItem(LOG) || "[]"); } catch (e) {}
    $("stallLog").innerHTML = ""; if (!list.length) $("stallLog").textContent = "None recorded.";
    list.forEach((t, i) => { if (i) $("stallLog").appendChild(document.createElement("br")); $("stallLog").appendChild(document.createTextNode(t)); });
    $("settings").hidden = false; syncSeg(); setTimeout(() => $("cityInput").focus(), 50); }
  function closeSettings() { if (!cfg.loc) { $("results").innerHTML = '<p class="hint">Pick a city first.</p>'; return; } $("settings").hidden = true; }
  $("openSettings").addEventListener("click", e => { e.stopPropagation(); openSettings(); });
  $("closeSettings").addEventListener("click", closeSettings);

  let searchTimer;
  $("cityInput").addEventListener("input", () => {
    clearTimeout(searchTimer);
    const q = $("cityInput").value.trim();
    if (q.length < 2) { $("results").innerHTML = ""; return; }
    searchTimer = setTimeout(async () => {
      try {
        const g = await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=en`);
        $("results").innerHTML = "";
        (g.results || []).forEach(p => {
          const b = document.createElement("button"); b.type = "button";
          b.textContent = p.name;
          const s = document.createElement("small"); s.textContent = [p.admin1, p.country].filter(Boolean).join(", ");
          b.append(s);
          b.addEventListener("click", () => setLoc({ name: p.name, lat: p.latitude, lon: p.longitude }));
          $("results").append(b);
        });
        if (!g.results) $("results").innerHTML = '<p class="hint">No match. Try a nearby larger city.</p>';
      } catch (e) { $("results").innerHTML = '<p class="hint">Search needs an internet connection.</p>'; }
    }, 300);
  });

  function setLoc(loc) {
    cfg.loc = { name: loc.name, lat: +(+loc.lat).toFixed(3), lon: +(+loc.lon).toFixed(3) };
    save(); $("settings").hidden = true; $("cityInput").value = ""; $("results").innerHTML = "";
    $("status").textContent = "Loading " + cfg.loc.name + "…"; refreshAll();
  }

  $("useGps").addEventListener("click", () => {
    if (!navigator.geolocation) { $("results").innerHTML = '<p class="hint">Location is not available here. Type your city instead.</p>'; return; }
    navigator.geolocation.getCurrentPosition(
      p => setLoc({ name: "My location", lat: p.coords.latitude, lon: p.coords.longitude }),
      () => { $("results").innerHTML = '<p class="hint">Location was blocked. Type your city instead.</p>'; },
      { timeout: 10000 }
    );
  });

  // Location can also come from the link: ?city=Pune&lat=18.52&lon=73.86
  const qs = new URLSearchParams(location.search);
  if (/^(mono|color|amber)$/.test(qs.get("theme") || "")) { cfg.theme = qs.get("theme"); save(); }
  if (qs.get("lat") && qs.get("lon")) { cfg.loc = { name: qs.get("city") || "My location", lat: +qs.get("lat"), lon: +qs.get("lon") }; save(); }

  applyTheme(); if (NATIVE) $("tapHint").hidden = true;
  tick(); fit();
  if (cfg.loc) refreshAll(); else openSettings();
  if (!NATIVE && "serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
